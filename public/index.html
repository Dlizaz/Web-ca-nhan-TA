<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>milky</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- 1 link duy nhất, script.js gom hết mọi font đang được dùng (font chung, font riêng từng phần...)
     rồi tải chung 1 lượt, tránh tải nhiều lần cho từng phần chữ. -->
<link id="dynamic-fonts-link" rel="stylesheet" href="" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Overlay bắt buộc click để bật nhạc (trình duyệt chặn autoplay) -->
  <div id="enter-overlay">
    <div class="enter-box">
      <p id="enter-text">nhấn để vào trang</p>
    </div>
  </div>

  <!-- Lớp nền: ảnh/gif do admin upload + overlay tối để chữ dễ đọc -->
  <div id="bg-layer"></div>
  <video id="bg-video" class="bg-video" autoplay loop muted playsinline hidden></video>
  <div id="bg-overlay"></div>

  <canvas id="fx-canvas"></canvas>

  <main id="stage" class="hidden">

    <!-- Avatar -->
    <div id="el-avatar" class="pos-el avatar-wrap">
      <img id="avatar-img" src="" alt="avatar" class="avatar" onerror="this.style.display='none'" />
      <img id="avatar-frame-img" class="avatar-frame" src="" alt="" hidden />
      <span class="status-dot"></span>
      <div id="click-bubble" class="click-bubble"></div>
    </div>

    <!-- Tên -->
    <h1 id="el-username" class="pos-el username"><span id="username-sparkles" class="username-sparkles"></span><span id="username-text">...</span></h1>

    <!-- Tiểu sử gõ chữ -->
    <p id="el-bio" class="pos-el bio-wrap"><span id="typed-bio" class="bio"></span></p>

    <!-- Lượt xem -->
    <div id="el-views" class="pos-el views">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
      <span id="view-count">0</span>
    </div>

    <!-- Widget Discord -->
    <div id="el-discord" class="pos-el discord-box" hidden>
      <img id="discord-avatar" class="discord-avatar" src="" alt="" />
      <div class="discord-info">
        <div class="discord-name-row">
          <span id="discord-name"></span>
          <span id="discord-tag"></span>
        </div>
        <div id="discord-message" class="discord-message"><span id="discord-message-inner" class="discord-message-inner"></span></div>
      </div>
    </div>

    <!-- Danh sách link -->
    <div id="el-links" class="pos-el links" data-links-container></div>

    <!-- Trình phát nhạc -->
    <div id="el-music" class="pos-el music-box" hidden>
      <img id="music-cover" class="music-cover" src="" alt="" />
      <div class="music-info">
        <div id="music-title" class="music-title">...</div>
        <div class="music-seek-row">
          <span id="music-current" class="music-time">0:00</span>
          <input type="range" id="music-seek" class="music-seek" min="0" max="1000" value="0" step="1" />
          <span id="music-duration" class="music-time">0:00</span>
        </div>
      </div>
      <button id="music-toggle" class="music-toggle-btn" aria-label="bật/tắt nhạc">
        <svg id="music-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>

  </main>

  <audio id="bg-audio" loop preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
