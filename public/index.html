<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>milky</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Overlay bắt buộc click để bật nhạc (trình duyệt chặn autoplay) -->
  <div id="enter-overlay">
    <div class="enter-box">
      <div class="enter-pulse"></div>
      <p>nhấn để vào trang</p>
    </div>
  </div>

  <canvas id="fx-canvas"></canvas>

  <main id="card" class="hidden">
    <div class="glow-ring"></div>

    <div class="avatar-wrap">
      <img id="avatar-img" src="" alt="avatar" class="avatar" onerror="this.style.display='none'" />
      <span class="status-dot"></span>
    </div>

    <h1 class="username"><span id="username-text">...</span><span class="badge" title="verified">✓</span></h1>
    <p id="typed-bio" class="bio"></p>

    <div class="views">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
      <span id="view-count">0</span> lượt xem
    </div>

    <div class="links" id="links-container"></div>

    <footer>
      <button id="music-toggle" aria-label="bật/tắt nhạc">
        <svg id="music-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <span class="made-with">made with ♥</span>
    </footer>
  </main>

  <audio id="bg-audio" loop preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
